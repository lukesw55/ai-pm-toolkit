name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional dependencies
        run: python3 -m pip install "pyyaml==6.0.2"

      - name: Environment preflight
        run: bash scripts/check_requirements.sh

      - name: Context and preflight regressions
        run: python3 scripts/test_context_scripts.py

      - name: Recorded eval protocol regressions
        run: python3 scripts/test_record_eval_run.py

      - name: Compile check all scripts
        run: python3 -m py_compile scripts/*.py

      - name: Hook shell syntax
        run: for hook in hooks/*.sh; do bash -n "$hook" || exit; done

      - name: Mirror drift check
        run: python3 scripts/sync_skills.py --check

      - name: Structural validator
        run: python3 scripts/validate_repo.py

      - name: Structural validator without PyYAML (fallback parser)
        run: python3 -S scripts/validate_repo.py

      - name: Validator schema-hardening regressions (valid JSON, unexpected shape)
        run: python3 scripts/test_validate_repo.py

      - name: Portable frontmatter regressions
        run: python3 scripts/test_frontmatter.py

      - name: Synthetic gate + adapter smoke suite
        run: python3 scripts/test_hooks.py

      - name: Hook routing and malformed input regressions
        run: python3 scripts/test_hook_contract.py

      - name: Grader assertion fixture tests
        run: python3 scripts/test_grade_evals.py

      - name: Memory distill + PII denylist fixture tests
        run: python3 scripts/test_memory.py

      - name: Grader zero-run smoke (no workspace runs recorded yet)
        run: python3 scripts/grade_evals.py

      - name: Memory doctor (bootstrap contract)
        # A fresh checkout ships no active project by design (real memory
        # is gitignored) — bootstrap one first so this is a real assertion
        # against the doctor's checks, not a call that fails by definition.
        run: |
          python3 scripts/init_context.py "CI Bootstrap Demo"
          python3 scripts/memory.py doctor

  validate:
    name: validate
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every supported Python version
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
