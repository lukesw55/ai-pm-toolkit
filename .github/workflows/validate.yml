name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional dependencies
        run: pip install pyyaml

      - name: Compile check all scripts
        run: python3 -m py_compile scripts/*.py

      - name: Hook shell syntax
        run: bash -n hooks/*.sh

      - name: Mirror drift check
        run: python3 scripts/sync_skills.py --check

      - name: Structural validator
        run: python3 scripts/validate_repo.py

      - name: Structural validator without PyYAML (fallback parser)
        run: python3 -S scripts/validate_repo.py

      - name: Validator schema-hardening regressions (valid JSON, unexpected shape)
        run: python3 scripts/test_validate_repo.py

      - name: Synthetic gate + adapter smoke suite
        run: python3 scripts/test_hooks.py

      - name: Grader assertion fixture tests
        run: python3 scripts/test_grade_evals.py

      - name: Memory distill + PII denylist fixture tests
        run: python3 scripts/test_memory.py

      - name: Grader zero-run smoke (no workspace runs recorded yet)
        run: python3 scripts/grade_evals.py

      - name: Memory doctor (bootstrap contract)
        # A fresh checkout ships no active project by design (real memory
        # is gitignored) — bootstrap one first so this is a real assertion
        # against the doctor's checks, not a call that fails by definition.
        run: |
          python3 scripts/init_context.py "CI Bootstrap Demo"
          python3 scripts/memory.py doctor
